
services:
  # Backend Web Service
  - type: web
    name: pharmasmart-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set this in Render dashboard
      - key: JWT_SECRET
        sync: false # Set this in Render dashboard

  # Frontend Static Site
  - type: static
    name: pharmasmart-frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://pharmasmart-backend.onrender.com/api # Replace with your actual backend URL after first deployment
